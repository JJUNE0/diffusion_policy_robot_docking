# @package _global_
# R-Geo on the front_dock_5th_floor (5F) dataset. IDENTICAL to
# goal_appearance_geometry.yaml except for the cache file paths and the
# single-camera source (`camera_orbbec-0` -> room2 -> image_bottom / dino_bottom);
# see that file for the rationale behind branch dropout on goal/geometry.
#
# Dataset provenance: dataset/front_dock_5f, built by
# scripts/build_front_dock_5f.py -- success==true records only, and only the
# post-segment-marker part of each record (segment_02..N), per
# dataset/front_dock_5th_floor/readme.md.
sensors:
  wheel:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 60
    stride: 1
    normalize: action
    dropout_prob: 0.0
  rgb_history:
    encoder: dino_image
    source: dino_bottom
    file: ${hydra:runtime.cwd}/dataset/front_dock_5f_train_dino_bottom.h5
    mode: history
    horizon: 5
    stride: 12
    num_latents: 16
    feat_dim: 768
  lidar:
    encoder: pointcloud
    source: lidar_points
    mode: current
    npoints_source: lidar_npoints
    num_latents: 16
  goal:
    encoder: goal_image
    source: dino_bottom
    file: ${hydra:runtime.cwd}/dataset/front_dock_5f_train_dino_bottom.h5
    mode: goal
    num_latents: 16
    feat_dim: 768
    dropout_prob: 0.2
  geometry:
    encoder: geometry
    source: geometry_bottom
    file: ${hydra:runtime.cwd}/dataset/front_dock_5f_train_reloc3r_bottom.h5
    mode: current
    dim: 4
    dropout_prob: 0.2
