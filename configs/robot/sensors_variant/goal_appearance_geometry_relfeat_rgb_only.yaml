# @package _global_
# R-Geo + Relational features (RGB only): identical to
# goal_appearance_geometry_relfeat.yaml but WITHOUT lidar. Tests whether
# the Reloc3r cross-attention decoder tokens (dec1/dec2) + wheel odometry
# alone are sufficient for docking, without metric-scale LiDAR position.
#
# See goal_appearance_geometry_relfeat.yaml for full architecture doc.
# Sensors: C = [Z_rgb, Z_wheel, Z_goal, Z_dec1, Z_dec2] (no Z_reloc/Z_lidar)
sensors:
  wheel:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 60
    stride: 1
    normalize: action
    dropout_prob: 0.0
  rgb_history:
    encoder: dino_image
    source: dino_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_dino_bottom.h5
    mode: history
    horizon: 5
    stride: 12
    num_latents: 16
    feat_dim: 768
  goal:
    encoder: goal_image
    source: dino_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_dino_bottom.h5
    mode: goal
    num_latents: 16
    feat_dim: 768
    dropout_prob: 0.2
  geometry:
    encoder: geometry
    source: geometry_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: current
    dim: 4
    dropout_prob: 0.2
  reloc3r_dec1:
    encoder: reloc3r_relation
    source: reloc3r_dec1_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: history
    horizon: 5
    stride: 12
    num_latents: 16
    feat_dim: 768
    dropout_prob: 0.2
  reloc3r_dec2:
    encoder: reloc3r_relation
    source: reloc3r_dec2_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: history
    horizon: 5
    stride: 12
    num_latents: 16
    feat_dim: 768
    dropout_prob: 0.2
