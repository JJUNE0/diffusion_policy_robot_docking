# ==========================================
# R-Geo trained FROM SCRATCH on the 5th-floor front-dock dataset.
#
# Identical to smr_rgeo.yaml (network, optimizer, batch size, sampler,
# action_norm) except for the dataset and its caches, so numbers here are
# comparable to the r_geo arm of the 0725 ablation modulo the dataset change.
#
# Dataset: dataset/front_dock_5f_train.h5 -- 71 episodes, built by
#   scripts/build_front_dock_5f.py + utils/preprocessing.py --no_room1.
#   Per dataset/front_dock_5th_floor/readme.md: metadata labels.success==true
#   only, and only the post-segment-marker part of each record (segment_02..N;
#   segment_01 is the drive-up to the docking start pose, not docking).
#   Held-out: dataset/front_dock_5f_test.h5 (the remaining 10 episodes).
#
# Run:
#   python scripts/train.py --config-name smr_rgeo_5f
# ==========================================
defaults:
  - sensors_variant: goal_appearance_geometry_5f
  - _self_

experiment_name: r_geo_5f
seed: 0
device: cuda:0

train_data_path: ${hydra:runtime.cwd}/dataset/front_dock_5f_train.h5
horizon: 60
obs_horizon: 60
batch_size: 256
num_workers: 0
prefetch_factor: null

state_dim: 2
velocity_dim: 2
image_width: 320
image_height: 240

use_modular_fusion: false
use_token_sequence_fusion: true

# Kept at minmax to match the r_* arms (see smr_rgeo.yaml for why).
action_norm: minmax

# ---- Network ----
diffusion_backbone: ddpm
d_model: 384
n_heads: 6
depth: 12
dropout: 0.1
condition_num_layers: 4

# ---- Diffusion / training ----
ema_rate: 0.999
num_epochs: 20
diffusion_gradient_steps: null
learning_rate: 1e-4
weight_decay: 1e-5
log_interval: 10
save_interval: 1000
resume_path: null
init_from: null

# ---- Inference defaults (unused during train) ----
use_ema: false
solver: ode_dpmsolver++_2M
w_cfg: 1
inference_sampling_steps: 30
num_samples: 1

hydra:
  job:
    chdir: true
  run:
    dir: outputs/
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
