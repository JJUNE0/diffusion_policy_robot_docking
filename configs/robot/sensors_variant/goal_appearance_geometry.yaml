# @package _global_
# R-Geo: C = [Z_rgb, Z_lidar, Z_wheel, Z_goal, Z_reloc]. Adds the frozen-
# Reloc3r offline body-frame geometry token (single token: [dx_body, dy_body,
# sin(relative_yaw_body), cos(relative_yaw_body)], see
# scripts/build_reloc3r_geometry_cache.py + scripts/calibrate_reloc3r_body_frame.py).
# docs/0725_reloc3r_test/reloc3r/reloc3r_0725.md
# Conditioning dropout (2026-07-23 field diagnosis): the variants that inject a
# LEARNED ESTIMATE of where the goal is — aux-pose feedback, and goal-image with
# no LiDAR branch — turned right on 75.1% / 62.1% of their turning frames
# (n=3508 / 4521, +-1.4% at 95% CI) against a 50.2% demo baseline, and both went
# 0/3 on the robot. Variants carrying the LiDAR branch alongside sat at 50-53%
# and each scored 1/3. Read: when a goal-estimate token is ALWAYS present the
# trunk learns to lean on it, so out-of-distribution estimate error turns
# straight into a steering bias with nothing to counterbalance it.
# These specs previously had no branch dropout at all, so every token was always
# present. NoMaD-style per-branch dropout (BaseModalityEncoder.branch_dropout)
# forces the trunk to stay competent on LiDAR+RGB+wheel alone, which demotes the
# goal/geometry tokens from load-bearing to advisory. It does not weaken the
# research claim — a geometry token that survives dropout training is
# demonstrably informative rather than a crutch.
sensors:
  wheel:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 60
    stride: 1
    normalize: action
    dropout_prob: 0.0
  rgb_history:
    encoder: dino_image
    source: dino_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_dino_bottom.h5
    mode: history
    horizon: 5
    stride: 12
    num_latents: 16
    feat_dim: 768
  lidar:
    encoder: pointcloud
    source: lidar_points
    mode: current
    npoints_source: lidar_npoints
    num_latents: 16
  goal:
    encoder: goal_image
    source: dino_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_dino_bottom.h5
    mode: goal
    num_latents: 16
    feat_dim: 768
    dropout_prob: 0.2
  geometry:
    encoder: geometry
    source: geometry_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: current
    dim: 4
    dropout_prob: 0.2
