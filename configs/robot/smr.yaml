# ==========================================
# 1. Project & System Setup
# ==========================================
experiment_name: flow_goal
seed: 0
device: cuda:0

# ==========================================
# 2. Dataset & DataLoader
# ==========================================
train_data_path : ${hydra:runtime.cwd}/dataset/after_0328_train.h5
horizon: 60           # 예측할 미래 궤적의 길이 (스텝 수)
vision_stride: 6
obs_horizon: 30
batch_size: 512
num_workers: 0
prefetch_factor : 2

# state_dim: 9          # encoder(2) + marker_pose(6) + marker_valid(1)
state_dim: 2            # encoder(2)
velocity_dim: 2
image_width: 320
image_height: 240

# ==========================================
# 2.5 Modular sensor fusion (ablation mode, legacy after_0328 dataset)
# ==========================================
# use_modular_fusion=false -> 기존 legacy 경로 그대로 (아래 sensors는 무시됨).
# use_modular_fusion=true  -> smr_new.yaml과 동일한 spec-driven 모듈 경로로
# after_0328 데이터를 학습. ABLATION = sensors 블록에서 항목을 주석/삭제.
# 주의: modular 모드는 사전계산된 DINO 캐시(sidecar h5)를 `file:`로 읽으므로
# use_dino_cache 플래그와 무관하게 항상 캐시가 필요함.
use_modular_fusion: false

sensors:
  encoder:
    encoder: motion
    source: encoder              # wheel odometry [vx, wz]
    mode: history
    dim: 2
    horizon: 30
    normalize: action
    dropout_prob: 0.1
  dino_bottom:
    encoder: dino_image
    source: dino_bottom          # precomputed DINO features (room2/image_bottom)
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_dino_bottom.h5
    mode: history
    horizon: 5                   # obs_horizon(30) / stride(6)
    stride: 6
    num_latents: 16
  lidar:
    encoder: pointcloud
    source: lidar_points
    mode: current
    npoints_source: lidar_npoints
    num_latents: 16
    head: aux_pose               # 제거하면 ICP-distilled 정밀 헤드 ablation

# ==========================================
# 3. Network Architecture (DiT & Condition)
# ==========================================
# rectified_flow | ddpm
diffusion_backbone: rectified_flow

d_model: 384           # DiT와 Condition 네트워크의 통일된 은닉 차원
n_heads: 6             # Attention 헤드 수 (384 // 64 = 6)
depth: 12              # DiT 블록의 깊이
dropout: 0.1           # Classifier-Free Guidance(CFG)를 위한 조건 마스킹 확률

# Goal-feature conditioning (CLAUDE.md §2.3 Loss A) — goal = docked frame's
# DINO feature; NoMaD-style masking (goal_mask_prob = P(goal active)).
use_goal: true
goal_mask_prob: 0.99    # fraction of samples that are goal-conditioned (rest undirected)
num_goal_latents: 16   # Perceiver latents per goal frame

# Raw-LiDAR-point branch + ICP-distilled precision aux head (Option A, single model).
use_lidar_points: true
num_lidar_latents: 16
use_aux_pose: true     # aux head predicts ICP dock pose (precision/arrival judge)
aux_weight: 1.0        # weight of the masked aux pose loss vs the denoising loss

# RAM saver: dataset returns only the sparse vision frames as uint8 (~24x less
# host RAM). Needed on the 15 GB machine. Keep on for training.
sparse_vision: true

# Single camera: use only room2 (=image_bottom); drops the room1 (image_top)
# branch. Halves DINO compute and cache size. (Model change: retrain required.)
use_room1: false

# DINO feature cache: precompute room2 DINO features offline (scripts/
# precompute_dino_cache.py) and read them during training instead of running the
# frozen backbone every step. Big training speedup; features are bit-identical.
use_dino_cache: true
dino_cache_path: ${hydra:runtime.cwd}/dataset/after_0328_train_dino_bottom.h5

# ==========================================
# 4. Diffusion Process
# ==========================================
ema_rate: 0.9999       # Exponential Moving Average 업데이트 비율

# ==========================================
# 5. Training
# ==========================================
num_epochs: 10                 # 학습 epoch 수. dataloader 길이(=floor(len(dataset)/batch_size)) 기반으로 gradient step 자동 환산
diffusion_gradient_steps: null  # num_epochs 가 설정되지 않았을 때만 쓰이는 fallback step 수
log_interval: 10
save_interval: 100
resume_path: null

learning_rate: 1e-4
weight_decay: 1e-5

# ==========================================
# 6. Inference
# ==========================================
diffusion_ckpt: latest
use_ema: True
solver : Euler                 # Rectified Flow: straight ODE integrated with Euler (replaces dpmsolver++)
w_cfg : 1                      # guidance weight
inference_sampling_steps: 20   # Euler ODE steps. RF is near-straight -> 5~20 steps suffice
num_samples : 8                # 1 개의 궤적만 비교하는게 아닌 여러개 궤적 비교

checkpoint_dir  : ${hydra:runtime.cwd}/results/encoder_vision/2026-03-03_17-44-33
checkpoint_step : 160000
eval_data_path  : ${hydra:runtime.cwd}/../dataset/validation_dataset1.h5

# ==========================================
# 7. Hydra Setup
# ==========================================
hydra:
  job:
    chdir: true  # false에서 true로 변경 추천: 실행 시 작업 디렉토리를 자동 생성된 폴더로 옮겨줍니다.

  # 단일 실행 시 저장 경로 (python inference.py 실행 시)
  run:
    dir: outputs/

  # Multi-run 실행 시 저장 경로 (python inference.py -m 실행 시)
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}-3
    # 각 데이터셋 결과가 들어갈 하위 폴더 이름 규칙
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}