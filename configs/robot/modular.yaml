# ==========================================
# Modular sensor-fusion config.
#
# ABLATION = edit the `sensors:` dict below. Comment out a sensor to drop it;
# add a block to include a new modality. The dataset, condition net, and (once
# wired) train loop all read this one dict -- no code edits per experiment.
#
# BACKBONE ABLATION (flow vs ddpm) = flip `diffusion_backbone` below. It is a
# one-line backbone swap, orthogonal to the sensors.
# ==========================================
experiment_name: modular_fusion
seed: 0
device: cuda:0

train_data_path: ${hydra:runtime.cwd}/../dataset/after_0328_train.h5
horizon: 60
obs_horizon: 30
vision_stride: 6
batch_size: 16
num_workers: 4

# Turn on the modular framework (routes setups.py to the spec-driven path).
use_modular_fusion: true
# rectified_flow | ddpm
diffusion_backbone: rectified_flow

# ---- Sensor fusion spec -------------------------------------------------
# encoder: registry key (motion | imu | dino_image | pointcloud)
# source : h5 dataset key
# mode   : history | current
sensors:
  velocity:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 30
    normalize: action
    dropout_prob: 0.2
  cam_top:
    encoder: dino_image
    source: dino_top        # precomputed DINO features (h5); see NOTE in dataset
    mode: history
    horizon: 5              # obs_horizon(30) / vision_stride(6)
    stride: 6
    num_latents: 16
  cam_bottom:
    encoder: dino_image
    source: dino_bottom
    mode: history
    horizon: 5
    stride: 6
    num_latents: 16
  # ---- add IMU for the new multimodal dataset (dataset/new): uncomment ----
  # imu:
  #   encoder: imu
  #   source: imu
  #   mode: history
  #   dim: 6                # gyro xyz + accel xyz
  #   horizon: 30
  #   dropout_prob: 0.2
  # ---- raw LiDAR points ----
  # lidar:
  #   encoder: pointcloud
  #   source: lidar_points
  #   mode: current
  #   npoints_source: lidar_npoints
  #   num_latents: 16

# ---- Network ----
d_model: 384
n_heads: 6
depth: 12
dropout: 0.1
condition_num_layers: 4
ema_rate: 0.9999

# ---- Training ----
num_epochs: null
diffusion_gradient_steps: 400001
log_interval: 100
save_interval: 10000
resume_path: null
learning_rate: 1e-4
weight_decay: 1e-5

hydra:
  job:
    chdir: true
  run:
    dir: result/hydra_logs/
