# @package _global_
# SAME arm as reloc3r_relfeat_dec1_only_now.yaml (dec1 only, 140 tokens,
# current-frame-included 0.5s-spaced history) but trained on the merged
# multi-environment dataset -- see reloc3r_relfeat_only_now_floor_multi.yaml
# for the full rationale. Only train_data_path and the sensor `file:` path
# differ from reloc3r_relfeat_dec1_only_now.yaml.
#
# Run:
#   python scripts/train.py --config-name smr_rgeo \
#       sensors_variant=reloc3r_relfeat_dec1_only_now_floor_multi \
#       experiment_name=r_relfeat_dec1_only_now_floor_multi \
#       train_data_path=${hydra:runtime.cwd}/dataset/floor_multi_train.h5
train_data_path: ${hydra:runtime.cwd}/dataset/floor_multi_train.h5
sensors:
  wheel:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 60
    stride: 1
    normalize: action
    dropout_prob: 0.0
  reloc3r_dec1:
    encoder: reloc3r_relation
    source: reloc3r_dec1_bottom
    file: ${hydra:runtime.cwd}/dataset/floor_multi_train_reloc3r_bottom.h5
    mode: history
    horizon: 5
    stride: 15
    window: 61
    num_latents: 16
    feat_dim: 768
    dropout_prob: 0.0
    cache_mmap: null
