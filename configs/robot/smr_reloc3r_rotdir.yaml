# ==========================================
# Reloc3r full-replacement vision encoder, ROTATION + DIRECTION (no aux head),
# raw lidar. Arm "rot+dir" of the rot-vs-rot+dir ablation (user request
# 2026-07-22, docs/reloc3r.md).
#
# Identical to smr_reloc3r_rot.yaml except one extra sensor: `direction`, the
# Reloc3r unit-translation-to-goal vector (scale-ambiguous by construction).
# docs/reloc3r.md found this channel degrades sharply at close range (median
# 16.9deg err at 0-0.3m vs 2.6deg at 0.9-1.1m) and recommended excluding it;
# this run tests that recommendation empirically instead of just asserting it.
# Requires scripts/precompute_reloc3r_direction.py to have been run on top of
# the reloc3r cache (writes `reloc3r_dir_bottom`).
#
# Run:  python scripts/train.py --config-name smr_reloc3r_rotdir
# ==========================================
experiment_name: reloc3r_rotdir_noaux
seed: 0
device: cuda:0

train_data_path: ${hydra:runtime.cwd}/dataset/after_0328_train.h5
horizon: 60
obs_horizon: 30
vision_stride: 6
batch_size: 512
num_workers: 4
prefetch_factor: 2

state_dim: 2
velocity_dim: 2
image_width: 320
image_height: 240

use_modular_fusion: true
use_aux_pose: false

sensors:
  encoder:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 30
    normalize: action
    dropout_prob: 0.1
  reloc3r_bottom:
    encoder: reloc3r_image
    source: reloc3r_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: history
    horizon: 5
    stride: 6
    num_latents: 16
    feat_dim: 1024
  rotation:
    encoder: rotation
    source: reloc3r_rot_bottom   # [R[:,0], R[:,1], geodesic_angle] to goal, 7-dim
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: history
    dim: 7
    horizon: 5
    stride: 6
    dropout_prob: 0.1
  direction:
    encoder: direction
    source: reloc3r_dir_bottom   # unit translation vector to goal, 3-dim (scale-ambiguous)
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: history
    dim: 3
    horizon: 5
    stride: 6
    dropout_prob: 0.1
  lidar:
    encoder: pointcloud
    source: lidar_points         # raw 2D points, NO aux_pose head
    mode: current
    npoints_source: lidar_npoints
    num_latents: 16

# ---- Network ----
diffusion_backbone: rectified_flow
d_model: 384
n_heads: 6
depth: 12
dropout: 0.1
condition_num_layers: 4

# ---- Diffusion / training (matched to flow_goal_scratch20 for a fair A/B) ----
ema_rate: 0.999
num_epochs: 20
diffusion_gradient_steps: null
learning_rate: 1e-4
weight_decay: 1e-5
log_interval: 10
save_interval: 1000
resume_path: null
init_from: null

# ---- Inference defaults (unused during train) ----
use_ema: false
solver: Euler
w_cfg: 1
inference_sampling_steps: 20
num_samples: 8

hydra:
  job:
    chdir: true
  run:
    dir: outputs/
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
