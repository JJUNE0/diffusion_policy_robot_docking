# ==========================================
# DINO + rotation (modular fusion, after_0328 dataset).
# Arm "A+rot" of the clean 3-arm ablation in docs/reloc3r.md:
#   A      = modular DINO baseline        -> configs/robot/smr.yaml + use_modular_fusion=true
#   A+rot  = modular DINO + rotation      -> THIS FILE
#   R+rot  = modular Reloc3r + rotation   -> configs/robot/smr_reloc3r.yaml
#
# Keeps the DINO patch backbone (feat_dim 768) and ADDS the Reloc3r
# rotation-to-goal signal. Isolates the value of the rotation modality
# independent of the DINO->Reloc3r backbone swap. The rotation cache still comes
# from scripts/precompute_reloc3r_cache.py (reloc3r_rot_bottom); the image
# features come from the existing DINO cache.
#
# Run:  python scripts/train.py --config-name smr_dino_rot
# ==========================================
experiment_name: dino_rot
seed: 0
device: cuda:0

train_data_path: ${hydra:runtime.cwd}/dataset/after_0328_train.h5
horizon: 60
obs_horizon: 30
vision_stride: 6
batch_size: 512
num_workers: 4
prefetch_factor: 2

state_dim: 2
velocity_dim: 2
image_width: 320
image_height: 240

use_modular_fusion: true

# ABLATION = edit this dict. reloc3r_bottom + rotation both read the same sidecar
# cache produced by scripts/precompute_reloc3r_cache.py (two datasets in one h5).
sensors:
  encoder:
    encoder: motion
    source: encoder              # wheel odometry [vx, wz]
    mode: history
    dim: 2
    horizon: 30
    normalize: action
    dropout_prob: 0.1
  dino_bottom:
    encoder: dino_image
    source: dino_bottom          # precomputed DINO features (room2/image_bottom)
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_dino_bottom.h5
    mode: history
    horizon: 5                   # obs_horizon(30) / stride(6)
    stride: 6
    num_latents: 16
  rotation:
    encoder: rotation
    source: reloc3r_rot_bottom   # [R[:,0], R[:,1], geodesic_angle] to goal, 7-dim
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom.h5
    mode: history
    dim: 7
    horizon: 5
    stride: 6
    dropout_prob: 0.1
  lidar:
    encoder: pointcloud
    source: lidar_points
    mode: current
    npoints_source: lidar_npoints
    num_latents: 16
    head: aux_pose               # ICP-distilled precision head (drop to ablate)

# ---- Network ----
diffusion_backbone: rectified_flow
d_model: 384
n_heads: 6
depth: 12
dropout: 0.1
condition_num_layers: 4

# ---- Aux precision loss shaping (mirrors smr.yaml; read by scripts/train.py) ----
aux_weight: 1.0
aux_dist_max: 1.1
aux_dist_power: 2.0
aux_dist_ref: 0.6

# ---- Diffusion / training (matched to flow_goal_scratch20 for a fair A/B) ----
ema_rate: 0.999
num_epochs: 20
diffusion_gradient_steps: null
learning_rate: 1e-4
weight_decay: 1e-5
log_interval: 10
save_interval: 1000
resume_path: null
init_from: null

# ---- Inference defaults (unused during train) ----
use_ema: false
solver: Euler
w_cfg: 1
inference_sampling_steps: 20
num_samples: 8

hydra:
  job:
    chdir: true
  run:
    dir: outputs/
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
