# 기본 하이퍼 파라미터 설정

# ==========================================
# 1. Project & System Setup
# ==========================================
experiment_name: performance_comparisoin_lidar
run_kind: train          # "train" or "inference" (set by each entry-point script)
seed: 0
device: cuda:0

# ==========================================
# 2. Dataset & DataLoader
# ==========================================
train_data_path : ${hydra:runtime.cwd}/../dataset/posetch_dataset.h5
horizon: 60           # 예측할 미래 궤적의 길이 (스텝 수)
vision_stride: 6
obs_horizon: 30
batch_size: 32
num_workers: 4

# state_dim: 9          # encoder(2) + marker_pose(6) + marker_valid(1)
state_dim: 2            # encoder(2)
velocity_dim: 2
image_width: 320
image_height: 240

# Vision: "raw_cnn" = trainable CNN on RGB (no DINO / HuggingFace). "dino" = pre-extracted 768-dim patch tokens.
vision_backend: raw_cnn

# Lidar BEV occupancy map (HDF5 must be built with `preprocessing.py --use_lidar`).
use_lidar: true
lidar_channels: 2          # 1: occupancy only, 2: [occupancy, log-density]
num_lidar_latents: 16      # PerceiverResampler latent count for the lidar branch
lidar_dropout_prob: 0.0    # branch-level dropout during training (CFG-style)

# ==========================================
# 3. Network Architecture (DiT & Condition)
# ==========================================
d_model: 384           # DiT와 Condition 네트워크의 통일된 은닉 차원
n_heads: 6             # Attention 헤드 수 (384 // 64 = 6)
depth: 12              # DiT 블록의 깊이
dropout: 0.1           # Classifier-Free Guidance(CFG)를 위한 조건 마스킹 확률

# ==========================================
# 4. Diffusion Process
# ==========================================
ema_rate: 0.9999       # Exponential Moving Average 업데이트 비율

# ==========================================
# 5. Training
# ==========================================
diffusion_gradient_steps: 150001
log_interval: 100
save_interval: 10000
resume_path: null

learning_rate: 1e-4
weight_decay: 1e-5

# ==========================================
# 6. Inference
# ==========================================
diffusion_ckpt: latest
use_ema: True
solver : ode_dpmsolver++_2M
w_cfg : 1                      # guidance weight
inference_sampling_steps: 100  # DPM-Solver++ 2M을 사용하기 위한 최적의 스텝 수 (10~20)
num_samples : 8                # 1 개의 궤적만 비교하는게 아닌 여러개 궤적 비교

# Load weights: checkpoint_path (full path to .pt) OR checkpoint_dir + checkpoint_step below.
checkpoint_path: null
checkpoint_dir : ${hydra:runtime.cwd}/results/encoder_vision/2026-03-03_17-44-33
checkpoint_step : 100000
eval_data_path  : ${hydra:runtime.cwd}/../dataset/validation_dataset1.h5

# ==========================================
# 7. Hydra Setup
# ==========================================
hydra:
  job:
    chdir: true  # 실행 시 작업 디렉토리를 자동 생성된 폴더로 옮겨줍니다.

  # 단일 실행 시 저장 경로
  # run_kind=train -> outputs/train/<exp>/<ts>
  # run_kind=inference -> outputs/inference/<exp>/<ts>
  run:
    dir: outputs/${oc.select:run_kind,train}/${oc.select:experiment_name,exp}/${now:%Y-%m-%d_%H-%M-%S}

  # Multi-run 실행 시 저장 경로 (python ... -m 실행 시)
  sweep:
    dir: multirun/${oc.select:run_kind,train}/${oc.select:experiment_name,exp}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}