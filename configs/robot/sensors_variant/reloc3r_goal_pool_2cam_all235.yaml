# @package _global_
# All 235 after_0328 + front_dock_5f_2cam episodes, with no held-out split.
# Goals are random within the trajectory's floor. `cross_goal_prob` of both
# 4F and 5F samples instead use a random goal from the other floor.
sensors:
  wheel:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 60
    stride: 1
    normalize: action
    dropout_prob: 0.0
  reloc3r_pair_bottom:
    encoder: reloc3r_goal_pair
    source: reloc3r_bottom
    file: ${hydra:runtime.cwd}/dataset/front_dock_4f_5f_combined/front_dock_4f_5f_combined_reloc3r_bottom.h5
    mode: goal_pool_pair
    horizon: 5
    stride: 12
    num_latents: 16
    feat_dim: 1024
    dec_dim: 768
    decoder_chunk: 4
    goal_pool_file: ${hydra:runtime.cwd}/dataset/goal_pool/goal_pool_reloc3r.h5
    goal_source: reloc3r_orbbec_0
    goal_pool_group: paired_goal
    goal_pool_filter:
      split: [all]
    goal_sampling: random
    goal_pool_match:
      episode_field: source_dataset
      goal_field: dataset
      cross_probability: ${cross_goal_prob}
      cross_map:
        after_0328: front_dock_5f_2cam
        front_dock_5f_2cam: after_0328
    dropout_prob: 0.0
  reloc3r_pair_top:
    encoder: reloc3r_goal_pair
    source: reloc3r_top
    file: ${hydra:runtime.cwd}/dataset/front_dock_4f_5f_combined/front_dock_4f_5f_combined_reloc3r_top.h5
    mode: goal_pool_pair
    horizon: 5
    stride: 12
    num_latents: 16
    feat_dim: 1024
    dec_dim: 768
    decoder_chunk: 4
    goal_pool_file: ${hydra:runtime.cwd}/dataset/goal_pool/goal_pool_reloc3r.h5
    goal_source: reloc3r_usb_0
    goal_pool_group: paired_goal
    goal_pool_filter:
      split: [all]
    goal_sampling: random
    goal_pool_match:
      episode_field: source_dataset
      goal_field: dataset
      cross_probability: ${cross_goal_prob}
      cross_map:
        after_0328: front_dock_5f_2cam
        front_dock_5f_2cam: after_0328
    dropout_prob: 0.0
