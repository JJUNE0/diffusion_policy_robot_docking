# @package _global_
# SAME arm as reloc3r_pose_only.yaml (final 12-D relative-pose tap, both
# streams, 220 condition tokens) with ONE variable changed: pose1/pose2's
# history sampling switches from stride=12/window=60 (front-anchored, most
# recent sample 11 frames behind t) to stride=15/window=61 (0.5s @ 30Hz, ends
# exactly at the current frame t) -- see reloc3r_relfeat_only_now.yaml for the
# full rationale. Everything else (feat_dim=12, n_patch=1, num_latents=16,
# cache_in_ram=true, wheel unchanged) is identical to reloc3r_pose_only.yaml.
#
# Token budget: wheel(60) + reloc3r_pose1(5*16=80) + reloc3r_pose2(80) = 220.
#
# Run:
#   python scripts/train.py --config-name smr_rgeo \
#       sensors_variant=reloc3r_pose_only_now experiment_name=r_pose_only_now
sensors:
  wheel:
    encoder: motion
    source: encoder
    mode: history
    dim: 2
    horizon: 60
    stride: 1
    normalize: action
    dropout_prob: 0.0
  reloc3r_pose1:
    encoder: reloc3r_relation
    source: reloc3r_pose1_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom_head.h5
    mode: history
    horizon: 5
    stride: 15
    window: 61
    num_latents: 16
    n_patch: 1
    feat_dim: 12
    dropout_prob: 0.0
    cache_in_ram: true
  reloc3r_pose2:
    encoder: reloc3r_relation
    source: reloc3r_pose2_bottom
    file: ${hydra:runtime.cwd}/dataset/after_0328_train_reloc3r_bottom_head.h5
    mode: history
    horizon: 5
    stride: 15
    window: 61
    num_latents: 16
    n_patch: 1
    feat_dim: 12
    dropout_prob: 0.0
    cache_in_ram: true
